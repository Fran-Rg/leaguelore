name: LoL lore ebook builder

on:
  schedule:
    - cron: '10 13 1 * *'  # Run on the 1st of every month at 13:10 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Requirements
        run: |
          chmod +x ./install.sh
          ./install.sh
          echo "TODAYDATE=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Run scrapper
        id: scrapy
        env:
          DEBUG: 1
        run: |
          chmod +x ./scrap.sh
          ./scrap.sh

      - name: Run kindler
        id: kindle
        run: |
          python kindle.py
          echo "NEW_CHAMP_COUNT=$(jq -r '.champ_count' meta.json)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: "League of Legends lore - ${{ steps.kindle.outputs.NEW_CHAMP_COUNT }} Champions - ${{ steps.requirements.outputs.TODAYDATE }}"
          tag_name: "lollore-${{ steps.kindle.outputs.NEW_CHAMP_COUNT }}-${{ steps.requirements.outputs.TODAYDATE }}"
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: "true"
          files: |
            *.epub
            lore.db

      - name: Prune releases older than 3 months
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: "lollore-${{ steps.kindle.outputs.NEW_CHAMP_COUNT }}-${{ steps.requirements.outputs.TODAYDATE }}"
        run: |
          cutoff=$(date -u -d '3 months ago' +'%Y-%m-%dT%H:%M:%SZ')
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' || echo "")
          echo "Deleting releases created before $cutoff (keeping '$KEEP_TAG' and latest '$latest_tag')"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | [.tag_name, .created_at] | @tsv' \
          | while IFS=$'\t' read -r tag created; do
              if [[ "$tag" == "$KEEP_TAG" || "$tag" == "$latest_tag" ]]; then
                continue
              fi
              if [[ "$created" < "$cutoff" ]]; then
                echo "Deleting release '$tag' (created $created)"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              fi
            done